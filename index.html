<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6FCFE" />
    <title>%GUIDE_TITLE%</title>
    <meta name="description" content="%GUIDE_INTRO%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%GUIDE_TITLE%" />
    <meta property="og:description" content="%GUIDE_INTRO%" />
    <meta property="og:url" content="https://digitalmidges.github.io/austin-guide-map/" />
    <meta property="og:image" content="https://digitalmidges.github.io/austin-guide-map/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap" />
    <style>
      body { margin: 0; background: #f2f8fa; }
      #startup { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; font: 600 16px system-ui, sans-serif; color: #4d6370; }
      #startup .spinner { width: 28px; height: 28px; border: 3px solid #d6eef5; border-top-color: #0e2f3f; border-radius: 50%; animation: spin 0.8s linear infinite; }
      #startup button { padding: 12px 20px; border: 0; border-radius: 14px; background: #ffd83d; color: #0e2f3f; font: 800 15px system-ui, sans-serif; cursor: pointer; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #startup .spinner { animation: none; } }
    </style>
    <script>
      // A cached page can point at files a newer release removed.
      // Reload once, then offer a button instead of looping.
      function retryAssets() {
        try {
          var last = Number(sessionStorage.getItem('guide-asset-retry') || 0);
          if (Date.now() - last > 60000) {
            sessionStorage.setItem('guide-asset-retry', String(Date.now()));
            location.reload();
            return;
          }
        } catch (_) {}
        var message = document.getElementById('startup-message');
        var retry = document.getElementById('startup-retry');
        if (message) message.textContent = 'The guide could not load. Please try again.';
        if (retry) retry.hidden = false;
      }
      window.addEventListener('vite:preloadError', function (event) { event.preventDefault(); retryAssets(); });
      window.addEventListener('error', function (event) {
        if (event.target instanceof HTMLScriptElement && event.target.type === 'module') retryAssets();
      }, true);
      window.setTimeout(function () {
        var retry = document.getElementById('startup-retry');
        if (retry) retry.hidden = false;
      }, 10000);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="startup" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span id="startup-message">Loading %GUIDE_TITLE%…</span>
        <button id="startup-retry" hidden onclick="location.reload()">Reload</button>
        <noscript>Please turn on JavaScript to see the places.</noscript>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
