<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800;900&display=swap" />
    <title>Preview · %GUIDE_TITLE%</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: #e3edf1;
        color: #0e2f3f;
        font-family: 'Figtree', system-ui, sans-serif;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px 16px;
        background: linear-gradient(180deg, #f6fcfe 0%, #d6eef5 100%);
        border-bottom: 1.5px solid #ffffff;
      }
      .group {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1.5px solid #d3e2e9;
        border-radius: 999px;
        background: #ffffff;
      }
      .group button,
      .reload {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #0e2f3f;
        font: 800 15px 'Figtree', system-ui, sans-serif;
        cursor: pointer;
      }
      .group button[aria-pressed='true'] {
        background: #0e2f3f;
        color: #ffffff;
      }
      .reload {
        border: 1.5px solid #d3e2e9;
        background: #ffffff;
      }
      button:focus-visible {
        outline: 3px solid #1a7395;
        outline-offset: 2px;
      }
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow: auto;
      }
      /* A simple phone body around a 390 x 844 screen. */
      .phone {
        flex-shrink: 0;
        padding: 12px;
        border-radius: 52px;
        background: #0e2f3f;
        box-shadow: 0 30px 60px -24px rgba(14, 47, 63, 0.55);
      }
      .phone iframe {
        display: block;
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 40px;
        background: #f2f8fa;
      }
      .desktop {
        width: 100%;
        height: 100%;
      }
      .desktop iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 1.5px solid #ffffff;
        border-radius: 16px;
        background: #f2f8fa;
        box-shadow: 0 20px 40px -24px rgba(14, 47, 63, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="group" role="group" aria-label="Page">
        <button type="button" data-page="index.html">Site</button>
        <button type="button" data-page="editor.html">Editor</button>
      </div>
      <div class="group" role="group" aria-label="Screen size">
        <button type="button" data-size="phone">Phone</button>
        <button type="button" data-size="desktop">Desktop</button>
      </div>
      <button type="button" class="reload">Reload</button>
    </div>
    <main class="stage">
      <div id="frame" class="phone"><iframe id="screen" title="Preview"></iframe></div>
    </main>
    <script>
      // The choice lives in the address, e.g. preview.html#phone/site, so a refresh keeps it.
      var frame = document.getElementById('frame');
      var viewer = document.getElementById('screen');
      var stage = document.querySelector('.stage');

      function read() {
        var parts = location.hash.replace('#', '').split('/');
        return {
          size: parts[0] === 'desktop' ? 'desktop' : 'phone',
          page: parts[1] === 'editor' ? 'editor.html' : 'index.html',
        };
      }

      function fitPhone() {
        // Shrink the phone to fit short windows, keeping its real 390px layout inside.
        if (frame.className !== 'phone') { frame.style.zoom = ''; return; }
        var available = stage.clientHeight - 40;
        frame.style.zoom = String(Math.min(1, available / 868));
      }

      function show() {
        var state = read();
        frame.className = state.size;
        if (viewer.getAttribute('src') !== state.page) viewer.setAttribute('src', state.page);
        document.querySelectorAll('[data-size]').forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.size === state.size));
        });
        document.querySelectorAll('[data-page]').forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.page === state.page));
        });
        fitPhone();
      }

      function go(change) {
        var state = read();
        var size = change.size || state.size;
        var page = change.page || state.page;
        location.hash = size + '/' + (page === 'editor.html' ? 'editor' : 'site');
      }

      document.querySelectorAll('[data-size]').forEach(function (button) {
        button.addEventListener('click', function () { go({ size: button.dataset.size }); });
      });
      document.querySelectorAll('[data-page]').forEach(function (button) {
        button.addEventListener('click', function () { go({ page: button.dataset.page }); });
      });
      document.querySelector('.reload').addEventListener('click', function () {
        viewer.contentWindow.location.reload();
      });
      window.addEventListener('hashchange', show);
      window.addEventListener('resize', fitPhone);
      show();
    </script>
  </body>
</html>
